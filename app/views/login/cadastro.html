<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="/assets/css/login.css">
    <script src="/assets/js/tema.js"></script>
</head>
<body>
    <main class="login">
        <form class="login__card" id="form-cadastro" novalidate>
            <p class="login__sistema">Sistema de Cadastro de Produtos</p>
            <h1 class="login__titulo">Cadastro de Usuário</h1>
            <p class="login__subtitulo">Preencha os dados para criar sua conta</p>

            <label class="campo" for="nome">
                <span>Nome</span>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    autocomplete="name"
                    maxlength="60"
                    required
                >
                <small class="campo__erro" id="erro-nome"></small>
            </label>

            <label class="campo" for="email">
                <span>E-mail</span>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    maxlength="100"
                    required
                >
                <small class="campo__erro" id="erro-email"></small>
            </label>

            <label class="campo" for="senha">
                <span>Senha</span>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    autocomplete="new-password"
                    required
                >
                <small class="campo__erro" id="erro-senha"></small>
            </label>

            <label class="campo" for="confirmar-senha">
                <span>Confirmar senha</span>
                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmarSenha"
                    autocomplete="new-password"
                    required
                >
                <small class="campo__erro" id="erro-confirmar-senha"></small>
            </label>

            <button type="submit" class="botao">Confirmar</button>
            <a class="botao botao--secundario" href="/login">Logar</a>
        </form>
    </main>
    <script src="/assets/js/login.js"></script>
</body>
</html>
