<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Produtos</title>
    <link rel="stylesheet" href="/assets/css/login.css">
    <script src="/assets/js/tema.js"></script>
</head>
<body>
    <main class="login">
        <form class="login__card" id="form-login" novalidate>
            <p class="login__sistema">Sistema de Cadastro de Produtos</p>
            <h1 class="login__titulo">Login</h1>
            <p class="login__subtitulo">Entre com seu usuário e senha</p>

            <label class="campo" for="usuario">
                <span>Usuário (e-mail)</span>
                <input
                    type="email"
                    id="usuario"
                    name="usuario"
                    autocomplete="username"
                    maxlength="100"
                    required
                >
                <small class="campo__erro" id="erro-usuario"></small>
            </label>

            <label class="campo" for="senha-login">
                <span>Senha</span>
                <input
                    type="password"
                    id="senha-login"
                    name="senha"
                    autocomplete="current-password"
                    required
                >
                <small class="campo__erro" id="erro-senha-login"></small>
            </label>

            <button type="submit" class="botao">Confirmar</button>
            <a class="botao botao--secundario" href="/cadastro">Cadastrar</a>
        </form>
    </main>
    <script src="/assets/js/login.js"></script>
</body>
</html>
