<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Cliente</title>
    <link rel="stylesheet" href="/assets/css/login.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="/assets/js/tema.js"></script>
</head>
<body class="app-body">
    <header class="app-topo">
        <a class="app-marca" href="/home">Sistema de Cadastro de Produtos</a>
        <nav class="app-nav">
            <a href="/home" data-nav="home">Home</a>
            <a href="/produtos" data-nav="produtos">Produtos</a>
            <a href="/clientes" data-nav="clientes">Clientes</a>
            <a href="/usuario" data-nav="usuario">Usuário</a>
        </nav>
        <div class="app-acoes">
            <span id="tema-slot"></span>
            <button type="button" class="botao botao--pequeno botao--secundario" id="botao-sair">Sair</button>
        </div>
    </header>

    <main class="app-conteudo">
        <div class="pagina-cabecalho">
            <div>
                <h1>Visualizar Cliente</h1>
                <p>Detalhes do cadastro</p>
            </div>
            <div class="pagina-acoes">
                <a class="botao botao--pequeno botao--secundario" href="/clientes">Voltar</a>
            </div>
        </div>

        <section class="cartao">
            <p class="carregando" id="ver-status">Carregando cliente...</p>
            <form class="ficha ficha--editavel" id="form-cliente-ver" novalidate hidden>
                <div>
                    <dt>Código</dt>
                    <dd class="ficha__valor" id="ver-codigo"></dd>
                    <input class="ficha__input" type="text" id="input-codigo" inputmode="numeric" maxlength="10" hidden>
                    <small class="campo__erro" id="erro-codigo"></small>
                </div>
                <div>
                    <dt>Nome</dt>
                    <dd class="ficha__valor" id="ver-nome"></dd>
                    <input class="ficha__input" type="text" id="input-nome" maxlength="60" hidden>
                    <small class="campo__erro" id="erro-nome"></small>
                </div>
                <div>
                    <dt>Fantasia</dt>
                    <dd class="ficha__valor" id="ver-fantasia"></dd>
                    <input class="ficha__input" type="text" id="input-fantasia" maxlength="100" hidden>
                    <small class="campo__erro" id="erro-fantasia"></small>
                </div>
                <div>
                    <dt>Documento</dt>
                    <div class="campo-documento" id="campo-documento-ver" data-visivel="false">
                        <span class="ficha__valor" id="ver-documento"></span>
                        <input class="ficha__input" type="text" id="input-documento" data-mascara="documento" maxlength="18" hidden>
                        <button type="button" class="campo-documento__toggle" aria-label="Mostrar documento"></button>
                    </div>
                    <small class="campo__erro" id="erro-documento"></small>
                </div>
            </form>
            <div class="pagina-acoes" id="acoes-cliente" hidden>
                <button type="button" class="botao botao--pequeno" id="botao-editar-cliente">Editar</button>
            </div>
        </section>

        <section class="cartao" id="secao-enderecos" hidden>
            <form class="form-grade form-grade--3" id="form-endereco" novalidate>
                <h2 class="secao-titulo campo--largo" id="titulo-form-endereco">Novo endereço</h2>
                <input type="hidden" id="id-endereco" name="id_endereco">

                <label class="campo" for="cep">
                    <span>CEP</span>
                    <input type="text" id="cep" name="cep" inputmode="numeric" data-mascara="cep" maxlength="9" required>
                    <small class="campo__erro" id="erro-cep"></small>
                </label>

                <label class="campo" for="estado">
                    <span>Estado</span>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione</option>
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AP">AP</option>
                        <option value="AM">AM</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MT">MT</option>
                        <option value="MS">MS</option>
                        <option value="MG">MG</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PR">PR</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RS">RS</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="SC">SC</option>
                        <option value="SP">SP</option>
                        <option value="SE">SE</option>
                        <option value="TO">TO</option>
                    </select>
                    <small class="campo__erro" id="erro-estado"></small>
                </label>

                <label class="campo" for="cidade">
                    <span>Cidade</span>
                    <input type="text" id="cidade" name="cidade" maxlength="100" required>
                    <small class="campo__erro" id="erro-cidade"></small>
                </label>

                <label class="campo" for="bairro">
                    <span>Bairro</span>
                    <input type="text" id="bairro" name="bairro" maxlength="100" required>
                    <small class="campo__erro" id="erro-bairro"></small>
                </label>

                <label class="campo" for="rua">
                    <span>Rua</span>
                    <input type="text" id="rua" name="rua" maxlength="100" required>
                    <small class="campo__erro" id="erro-rua"></small>
                </label>

                <label class="campo" for="numero">
                    <span>Número</span>
                    <input type="text" id="numero" name="numero" maxlength="10" required>
                    <small class="campo__erro" id="erro-numero"></small>
                </label>

                <div class="form-acoes campo--largo">
                    <button type="submit" class="botao" id="botao-salvar-endereco">Salvar endereço</button>
                    <button type="button" class="botao botao--secundario" id="botao-cancelar-endereco" hidden>Cancelar edição</button>
                </div>
            </form>

            <div class="pagina-cabecalho">
                <h2 class="secao-titulo">Endereços</h2>
            </div>
            <div class="enderecos" id="lista-enderecos"></div>
        </section>
    </main>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/cliente.js"></script>
</body>
</html>
