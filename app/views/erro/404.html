<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Página não encontrada</title>
    <link rel="stylesheet" href="/assets/css/login.css">
    <link rel="stylesheet" href="/assets/css/erro.css">
    <script src="/assets/js/tema.js"></script>
</head>
<body class="erro-body">
    <div class="erro-fundo" aria-hidden="true"></div>

    <header class="erro-topo">
        <p class="erro-marca">Sistema de Cadastro de Produtos</p>
    </header>

    <main class="erro">
        <section class="erro__card" aria-labelledby="erro-titulo">
            <p class="erro__selo">Erro</p>
            <p class="erro__codigo" aria-hidden="true">404</p>
            <h1 id="erro-titulo" class="erro__titulo">Página não encontrada</h1>
            <p class="erro__texto">
                O endereço que você tentou abrir não existe, foi removido
                ou está temporariamente indisponível.
            </p>
            <div class="erro__acoes">
                <a class="botao" href="/login">Voltar ao login</a>
            </div>
        </section>
    </main>

    <footer class="erro-rodape">
        <p>Soft-line · Cadastro de produtos e clientes</p>
    </footer>
</body>
</html>
